feature: live-patroller-map
version: 1.0.0
description: Uber-style realtime map of active patrollers with signed 30-second heartbeats and sector-scoped visibility
category: data
tags:
  - live
  - map
  - realtime
  - heartbeat
  - cpf
  - uber-style

fields:
  - name: patrol_id
    type: hidden
    required: true
    label: Patrol identifier
    immutable: true

  - name: call_sign
    type: hidden
    required: true
    label: Patroller call sign

  - name: lat
    type: number
    required: true
    label: Latitude
    validation:
      - type: min
        value: -90
        message: Invalid latitude
      - type: max
        value: 90
        message: Invalid latitude

  - name: lng
    type: number
    required: true
    label: Longitude
    validation:
      - type: min
        value: -180
        message: Invalid longitude
      - type: max
        value: 180
        message: Invalid longitude

  - name: heading
    type: number
    required: false
    label: Heading (degrees)
    validation:
      - type: min
        value: 0
        message: Heading must be between 0 and 360
      - type: max
        value: 360
        message: Heading must be between 0 and 360

  - name: speed
    type: number
    required: false
    label: Speed (km/h)
    validation:
      - type: min
        value: 0
        message: Speed cannot be negative

  - name: accuracy_m
    type: number
    required: true
    label: GPS accuracy (m)
    validation:
      - type: min
        value: 0
        message: Accuracy cannot be negative

  - name: heartbeat_timestamp
    type: datetime
    required: true
    label: Heartbeat timestamp

  - name: signature
    type: token
    required: true
    label: Heartbeat signature
    sensitive: true

  - name: scope
    type: select
    required: false
    label: Viewer scope
    options:
      - value: sector
        label: Sector
      - value: cpf
        label: Whole CPF

rules:
  security:
    required_authentication: true
    heartbeat_signature_required: true
    heartbeat_signature_key_source: device_token_issued_at_login
    rate_limit:
      window_seconds: 20
      max_requests: 1
      scope: per_patrol
      purpose: anti_spam
    viewer_scope:
      patroller: sector
      sector_lead: sector
      admin: cpf
      call_centre_agent: cpf
    dispatch_view_audit: true
  visibility:
    active_patrol_only: true
    stand_down_purge_delay_seconds: 5
    stale_threshold_minutes: 2
    stale_behavior: grey_out_pin_not_remove
  retention:
    live_cache: ephemeral_wiped_on_stand_down
    historical_polyline: appended_to_patrol_record_as_breadcrumbs
  realtime:
    preferred_channel: websocket
    fallback_channel: polling
    fallback_interval_seconds: 30

outcomes:
  unauthorized_viewer:
    priority: 1
    error: LIVE_MAP_UNAUTHORIZED
    given:
      - any:
          - field: session
            source: session
            operator: not_exists
          - all:
              - field: access_level
                source: session
                operator: neq
                value: call_centre_agent
              - field: actor_active_patrol
                source: db
                operator: not_exists
    result: show "Only active patrollers or dispatch can view the live map."

  heartbeat_rate_limited:
    priority: 2
    error: LIVE_MAP_HEARTBEAT_RATE_LIMITED
    given:
      - field: heartbeat_count_last_20s
        source: computed
        operator: gt
        value: 1
    result: throttle heartbeat silently

  heartbeat_invalid_signature:
    priority: 3
    error: LIVE_MAP_HEARTBEAT_INVALID_SIGNATURE
    given:
      - field: signature
        source: input
        operator: neq
        value: expected_device_signature
    then:
      - action: emit_event
        event: livemap.forgerydetected
        payload:
          - patrol_id
          - call_sign
          - timestamp
          - ip_address
    result: reject heartbeat and flag device for review

  heartbeat_patrol_not_active:
    priority: 4
    error: LIVE_MAP_HEARTBEAT_PATROL_NOT_ACTIVE
    given:
      - field: patrol_state
        source: db
        operator: neq
        value: active
    result: reject heartbeat

  no_active_patrols:
    priority: 9
    given:
      - field: active_patrol_count_in_scope
        source: db
        operator: eq
        value: 0
    result: render empty map with "No active patrols in your view"

  heartbeat_accepted:
    priority: 10
    transaction: true
    given:
      - field: patrol_state
        source: db
        operator: eq
        value: active
      - field: signature
        source: input
        operator: eq
        value: expected_device_signature
      - field: heartbeat_count_last_20s
        source: computed
        operator: lte
        value: 1
    then:
      - action: set_field
        target: live_cache_entry
        value: upsert_with_heartbeat
        description: Upsert the patrol's pin in the ephemeral live cache
      - action: create_record
        type: polyline_point
        target: patrol.breadcrumbs
        description: Append this point to the patrol record's polyline for SARS audit
      - action: emit_event
        event: livemap.heartbeat
        payload:
          - patrol_id
          - call_sign
          - lat
          - lng
          - heading
          - speed
          - accuracy_m
          - heartbeat_timestamp
    result: push updated pin to all subscribers in this patrol's scope

  subscription_loaded:
    priority: 11
    transaction: false
    given:
      - field: session
        source: session
        operator: exists
      - field: viewer_scope_resolved
        source: computed
        operator: exists
    then:
      - action: emit_event
        event: livemap.subscribed
        payload:
          - viewer_call_sign
          - access_level
          - scope
          - active_patrol_count
          - timestamp
    result: render map with pins for all active patrollers in resolved scope

errors:
  - code: LIVE_MAP_UNAUTHORIZED
    status: 403
    message: Live map is only available to active patrollers and dispatch
    retry: false
  - code: LIVE_MAP_HEARTBEAT_RATE_LIMITED
    status: 429
    message: Heartbeat rate limited
    retry: true
  - code: LIVE_MAP_HEARTBEAT_INVALID_SIGNATURE
    status: 401
    message: Heartbeat signature is invalid
    retry: false
  - code: LIVE_MAP_HEARTBEAT_PATROL_NOT_ACTIVE
    status: 409
    message: Patrol is not in active state
    retry: false
  - code: LIVE_MAP_REALTIME_CHANNEL_DOWN
    status: 503
    message: Realtime channel unavailable. Falling back to polling.
    retry: true

events:
  - name: livemap.heartbeat
    description: A patrol heartbeat was accepted and pushed to subscribers
    payload:
      - patrol_id
      - call_sign
      - lat
      - lng
      - heading
      - speed
      - accuracy_m
      - heartbeat_timestamp
  - name: livemap.subscribed
    description: A viewer opened the live map
    payload:
      - viewer_call_sign
      - access_level
      - scope
      - active_patrol_count
      - timestamp
  - name: livemap.forgerydetected
    description: A heartbeat with an invalid device signature was rejected
    payload:
      - patrol_id
      - call_sign
      - timestamp
      - ip_address

related:
  - feature: patroller-login
    type: required
    reason: Live map requires an authenticated device-bound session for signed heartbeats
  - feature: commence-patrol
    type: required
    reason: Only active patrols emit heartbeats and appear on the map
  - feature: stand-down-patrol
    type: required
    reason: Stand down purges the patrol's live cache entry within 5 seconds

ui_hints:
  layout: full_screen_map
  heartbeat_interval_seconds: 30
  stale_threshold_minutes: 2
  dispatch_badge_for_call_centre_agent: true
  mockup_gap: Live Patroller Map screen is not in the current mockup set and should be designed
