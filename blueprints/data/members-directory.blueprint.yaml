feature: members-directory
version: 1.0.0
description: Sector-scoped CPF members directory with next-of-kin and live on-duty status
category: data
tags:
  - directory
  - members
  - cpf
  - next-of-kin
  - read-only

fields:
  - name: search_term
    type: text
    required: false
    label: Search
    placeholder: Name, call sign, or phone
    validation:
      - type: minLength
        value: 2
        message: Search term must be at least 2 characters

  - name: sector
    type: hidden
    required: false
    label: Sector (from session)

  - name: results
    type: json
    required: false
    label: Member results

rules:
  security:
    required_authentication: true
    read_only: true
    sector_scoped: true
    no_cross_cpf_visibility: true
    exclude_inactive_members: true
    rate_limit:
      window_seconds: 60
      max_requests: 30
      scope: per_user
    audit:
      log_every_search: true
      log_every_tap_to_call: true
      log_next_of_kin_tap_to_call: true
      log_payload:
        - actor_call_sign
        - search_term
        - result_count
        - timestamp
        - ip_address
        - device_id
  response:
    fields_whitelist:
      - member_id
      - name
      - call_sign
      - phone
      - address
      - sector
      - access_level
      - is_on_duty
      - next_of_kin
    forbidden_fields:
      - password_hash
      - id_number
      - device_token
  live_status:
    source: live-patroller-map cache
    stale_threshold_minutes: 2
  edit_policy:
    self_edit_allowed: false
    admin_edit_allowed: true
    admin_edit_scope: admin_same_sector_as_target
    edit_blueprint: member-profile-admin-edit

outcomes:
  unauthorized:
    priority: 1
    error: MEMBERS_UNAUTHORIZED
    given:
      - field: session
        source: session
        operator: not_exists
    result: show "Please log in to view members."

  rate_limited:
    priority: 2
    error: MEMBERS_RATE_LIMITED
    given:
      - field: request_count
        source: computed
        operator: gt
        value: 30
    result: show "Too many searches. Please wait a moment."

  search_term_too_short:
    priority: 3
    error: MEMBERS_SEARCH_TERM_TOO_SHORT
    given:
      - field: search_term
        source: input
        operator: exists
      - field: search_term_length
        source: computed
        operator: lt
        value: 2
    result: show "Search term must be at least 2 characters."

  no_results:
    priority: 9
    error: MEMBERS_NO_RESULTS
    given:
      - field: result_count
        source: computed
        operator: eq
        value: 0
    then:
      - action: emit_event
        event: members.searched
        payload:
          - actor_call_sign
          - search_term
          - result_count
          - timestamp
    result: show empty state "No members found"

  successful_search:
    priority: 10
    transaction: false
    given:
      - field: session
        source: session
        operator: exists
      - field: result_count
        source: computed
        operator: gt
        value: 0
    then:
      - action: set_field
        target: is_on_duty
        value: joined_from_live_patroller_cache
      - action: emit_event
        event: members.searched
        payload:
          - actor_call_sign
          - search_term
          - result_count
          - timestamp
          - ip_address
          - device_id
    result: render member cards sorted with on-duty members first

errors:
  - code: MEMBERS_UNAUTHORIZED
    status: 401
    message: Please log in to view members
    retry: false
  - code: MEMBERS_RATE_LIMITED
    status: 429
    message: Too many searches. Please wait a moment.
    retry: true
  - code: MEMBERS_SEARCH_TERM_TOO_SHORT
    status: 422
    message: Search term must be at least 2 characters
    retry: true
  - code: MEMBERS_NO_RESULTS
    status: 404
    message: No members found
    retry: true

events:
  - name: members.searched
    description: A members directory search was executed
    payload:
      - actor_call_sign
      - search_term
      - result_count
      - timestamp
      - ip_address
      - device_id
  - name: members.taptocall
    description: A patroller tapped to call a CPF member
    payload:
      - actor_call_sign
      - target_member_id
      - timestamp
  - name: members.noktaptocall
    description: A patroller tapped to call a member next-of-kin
    payload:
      - actor_call_sign
      - target_member_id
      - nok_relationship
      - timestamp

related:
  - feature: patroller-login
    type: required
    reason: Directory access requires an authenticated session
  - feature: live-patroller-map
    type: recommended
    reason: Live on-duty status is joined from the live patroller map cache

ui_hints:
  layout: search_over_list
  card_fields:
    - name
    - call_sign
    - phone
    - address
    - access_level
    - is_on_duty
  expandable_section: next_of_kin
  tap_action: dial_phone
  mockup_gap: Members card should show on-duty badge and next-of-kin expand section
