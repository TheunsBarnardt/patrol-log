feature: residents-directory
version: 1.0.0
description: Sector-scoped searchable directory of residents for patrollers with POPIA audit logging
category: data
tags:
  - directory
  - residents
  - search
  - popia
  - read-only

fields:
  - name: search_term
    type: text
    required: false
    label: Search
    placeholder: Name, phone, or address
    validation:
      - type: minLength
        value: 2
        message: Search term must be at least 2 characters

  - name: sector
    type: hidden
    required: false
    label: Sector (from session)

  - name: results
    type: json
    required: false
    label: Resident results

rules:
  security:
    required_authentication: true
    read_only: true
    sector_scoped: true
    popia_compliance:
      data_minimization: true
      response_fields_whitelist:
        - resident_id
        - name
        - phone
        - address
      forbidden_fields:
        - id_number
        - date_of_birth
        - gender
    rate_limit:
      window_seconds: 60
      max_requests: 30
      scope: per_user
    audit:
      log_every_search: true
      log_every_tap_to_call: true
      log_payload:
        - actor_call_sign
        - search_term
        - result_count
        - timestamp
        - ip_address
        - device_id
  caching:
    server_cache_ttl_seconds: 300
    cache_key:
      - sector
      - search_term
    on_device_cache:
      encrypted_at_rest: true
      wiped_on_logout: true

outcomes:
  unauthorized:
    priority: 1
    error: RESIDENTS_UNAUTHORIZED
    given:
      - field: session
        source: session
        operator: not_exists
    result: show "Please log in to view residents."

  rate_limited:
    priority: 2
    error: RESIDENTS_RATE_LIMITED
    given:
      - field: request_count
        source: computed
        operator: gt
        value: 30
    then:
      - action: emit_event
        event: residents.ratelimited
        payload:
          - actor_call_sign
          - timestamp
    result: show "Too many searches. Please wait a moment."

  search_term_too_short:
    priority: 3
    error: RESIDENTS_SEARCH_TERM_TOO_SHORT
    given:
      - field: search_term
        source: input
        operator: exists
      - field: search_term_length
        source: computed
        operator: lt
        value: 2
    result: show "Search term must be at least 2 characters."

  sync_unavailable:
    priority: 4
    error: RESIDENTS_SYNC_UNAVAILABLE
    given:
      - field: resident_store_status
        source: system
        operator: neq
        value: ok
      - field: device_cache_present
        source: system
        operator: eq
        value: false
    result: show "Directory temporarily unavailable. Please try again."

  no_results:
    priority: 9
    error: RESIDENTS_NO_RESULTS
    given:
      - field: result_count
        source: computed
        operator: eq
        value: 0
    then:
      - action: emit_event
        event: residents.searched
        payload:
          - actor_call_sign
          - search_term
          - result_count
          - timestamp
    result: show empty state "No residents found"

  successful_search:
    priority: 10
    transaction: false
    given:
      - field: session
        source: session
        operator: exists
      - field: result_count
        source: computed
        operator: gt
        value: 0
    then:
      - action: emit_event
        event: residents.searched
        payload:
          - actor_call_sign
          - search_term
          - result_count
          - timestamp
          - ip_address
          - device_id
    result: render list of name, phone, address cards with tap-to-call

errors:
  - code: RESIDENTS_UNAUTHORIZED
    status: 401
    message: Please log in to view residents
    retry: false
  - code: RESIDENTS_RATE_LIMITED
    status: 429
    message: Too many searches. Please wait a moment.
    retry: true
  - code: RESIDENTS_SEARCH_TERM_TOO_SHORT
    status: 422
    message: Search term must be at least 2 characters
    retry: true
  - code: RESIDENTS_SYNC_UNAVAILABLE
    status: 503
    message: Directory temporarily unavailable
    retry: true
  - code: RESIDENTS_NO_RESULTS
    status: 404
    message: No residents found
    retry: true

events:
  - name: residents.searched
    description: A residents directory search was executed (POPIA audit)
    payload:
      - actor_call_sign
      - search_term
      - result_count
      - timestamp
      - ip_address
      - device_id
  - name: residents.taptocall
    description: A patroller tapped to call a resident (POPIA audit)
    payload:
      - actor_call_sign
      - resident_id
      - timestamp
  - name: residents.ratelimited
    description: Residents directory requests were rate limited for a user
    payload:
      - actor_call_sign
      - timestamp

related:
  - feature: patroller-login
    type: required
    reason: Directory access requires an authenticated session

ui_hints:
  layout: search_over_list
  card_fields:
    - name
    - phone
    - address
  tap_action: dial_phone
