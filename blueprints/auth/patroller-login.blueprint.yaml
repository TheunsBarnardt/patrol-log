feature: patroller-login
version: 1.0.0
description: Authenticate a CPF patroller by call sign and password with WhatsApp-style device-bound session
category: auth
tags:
  - authentication
  - cpf
  - patroller
  - device-session
  - popia

fields:
  - name: call_sign
    type: text
    required: true
    label: Call sign
    placeholder: e.g. WV46
    validation:
      - type: required
        message: Call sign is required
      - type: pattern
        value: "^[A-Z0-9]{2,10}$"
        message: Call sign must be 2 to 10 uppercase letters or digits
      - type: maxLength
        value: 10
        message: Call sign is too long

  - name: password
    type: password
    required: true
    label: Password
    sensitive: true
    validation:
      - type: required
        message: Password is required
      - type: minLength
        value: 8
        message: Password must be at least 8 characters
      - type: maxLength
        value: 128
        message: Password is too long

  - name: device_id
    type: token
    required: true
    label: Device identifier
    sensitive: true

  - name: device_token
    type: token
    required: false
    label: Device token
    sensitive: true

  - name: access_level
    type: select
    required: false
    label: Access level
    options:
      - value: call_centre_agent
        label: Call Centre Agent
      - value: patroller
        label: Patroller
      - value: sector_lead
        label: Sector Lead
      - value: admin
        label: Administrator

  - name: organization
    type: text
    required: false
    label: Organization

  - name: sector
    type: text
    required: false
    label: Sector

  - name: province
    type: text
    required: false
    label: Province

rules:
  security:
    password_hashing:
      algorithm: argon2id
      constant_time_comparison: true
    rate_limit:
      window_seconds: 900
      max_requests: 5
      scope: per_call_sign_and_ip
    lockout:
      max_consecutive_failures: 10
      lockout_duration_minutes: 30
      scope: per_call_sign
    credential_error_handling:
      generic_message: true
  session:
    type: device_token
    model: whatsapp_style_device_bound
    auto_resume_on_launch: true
    revocable_by_admin: true
    rotation_on_password_change: true
  audit:
    log_all_attempts: true
    payload_fields:
      - call_sign
      - ip_address
      - device_id
      - timestamp
      - outcome

outcomes:
  rate_limited:
    priority: 1
    error: LOGIN_RATE_LIMITED
    given:
      - field: request_count
        source: computed
        operator: gt
        value: 5
        description: More than 5 attempts within a 15-minute window for this call sign or IP
    result: show "Too many login attempts. Please wait a few minutes and try again."

  account_locked:
    priority: 2
    error: LOGIN_ACCOUNT_LOCKED
    given:
      - field: failed_login_attempts
        source: db
        operator: gte
        value: 10
      - field: locked_until
        source: db
        operator: gt
        value: now
    then:
      - action: emit_event
        event: login.locked
        payload:
          - call_sign
          - patroller_id
          - timestamp
          - locked_until
    result: show "Account temporarily locked. Please try again later."

  account_inactive:
    priority: 3
    error: LOGIN_ACCOUNT_INACTIVE
    given:
      - field: status
        source: db
        operator: eq
        value: inactive
    result: show "This account is inactive. Please contact your CPF administrator."

  device_revoked:
    priority: 4
    error: LOGIN_DEVICE_REVOKED
    given:
      - field: device_status
        source: db
        operator: eq
        value: revoked
    then:
      - action: emit_event
        event: login.devicerevoked
        payload:
          - call_sign
          - device_id
          - timestamp
    result: show "This device has been revoked. Please contact your CPF administrator."

  missing_input:
    priority: 5
    error: LOGIN_MISSING_INPUT
    given:
      - any:
          - field: call_sign
            source: input
            operator: not_exists
          - field: password
            source: input
            operator: not_exists
    result: show "Call sign and password are both required."

  invalid_credentials:
    priority: 6
    error: LOGIN_INVALID_CREDENTIALS
    transaction: true
    given:
      - any:
          - field: patroller
            source: db
            operator: not_exists
          - field: password
            source: input
            operator: neq
            value: stored_hash
    then:
      - action: set_field
        target: failed_login_attempts
        value: increment
      - action: emit_event
        event: login.failed
        payload:
          - call_sign
          - timestamp
          - ip_address
          - device_id
          - attempt_count
      - action: set_field
        target: locked_until
        value: now + 30m
        when: "failed_login_attempts >= 10"
    result: show "Invalid call sign or password."

  auto_resume_with_device_token:
    priority: 9
    transaction: true
    given:
      - field: device_token
        source: input
        operator: exists
      - field: device_token
        source: db
        operator: eq
        value: input_device_token
      - field: device_status
        source: db
        operator: eq
        value: active
      - field: status
        source: db
        operator: eq
        value: active
    then:
      - action: emit_event
        event: login.resumed
        payload:
          - patroller_id
          - call_sign
          - device_id
          - timestamp
    result: redirect to home dashboard with profile loaded

  successful_login:
    priority: 10
    transaction: true
    given:
      - field: call_sign
        source: input
        operator: exists
      - field: patroller
        source: db
        operator: exists
      - field: password
        source: input
        operator: eq
        value: stored_hash
      - field: status
        source: db
        operator: eq
        value: active
    then:
      - action: set_field
        target: failed_login_attempts
        value: 0
      - action: create_record
        type: device_session
        target: device_session
        description: Issue long-lived device token bound to device_id
      - action: emit_event
        event: login.success
        payload:
          - patroller_id
          - call_sign
          - device_id
          - access_level
          - timestamp
          - ip_address
    result: redirect to home dashboard with profile (access_level, organization, sector, province) loaded

errors:
  - code: LOGIN_INVALID_CREDENTIALS
    status: 401
    message: Invalid call sign or password
    retry: true
  - code: LOGIN_MISSING_INPUT
    status: 422
    message: Call sign and password are both required
    retry: true
  - code: LOGIN_ACCOUNT_INACTIVE
    status: 403
    message: This account is inactive. Please contact your CPF administrator.
    retry: false
  - code: LOGIN_ACCOUNT_LOCKED
    status: 423
    message: Account temporarily locked. Please try again later.
    retry: false
  - code: LOGIN_RATE_LIMITED
    status: 429
    message: Too many login attempts. Please wait a few minutes and try again.
    retry: true
  - code: LOGIN_DEVICE_REVOKED
    status: 403
    message: This device has been revoked. Please contact your CPF administrator.
    retry: false

events:
  - name: login.success
    description: Patroller authenticated successfully and device session issued
    payload:
      - patroller_id
      - call_sign
      - device_id
      - access_level
      - timestamp
      - ip_address
  - name: login.failed
    description: Authentication attempt failed
    payload:
      - call_sign
      - timestamp
      - ip_address
      - device_id
      - attempt_count
  - name: login.locked
    description: Account locked due to consecutive failed attempts
    payload:
      - call_sign
      - patroller_id
      - timestamp
      - locked_until
  - name: login.devicerevoked
    description: Login attempted from a revoked device
    payload:
      - call_sign
      - device_id
      - timestamp
  - name: login.resumed
    description: Session auto-resumed from stored device token (WhatsApp-style)
    payload:
      - patroller_id
      - call_sign
      - device_id
      - timestamp

related:
  - feature: commence-patrol
    type: required
    reason: Patrollers must be authenticated before commencing a patrol
  - feature: stand-down-patrol
    type: required
    reason: Patrollers must be authenticated before standing down
  - feature: residents-directory
    type: required
    reason: Directory access requires an authenticated session
  - feature: members-directory
    type: required
    reason: Directory access requires an authenticated session
  - feature: emergency-contacts-directory
    type: required
    reason: Emergency contact access requires an authenticated session
  - feature: hotspots-map
    type: required
    reason: Hotspot map requires an authenticated session
  - feature: live-patroller-map
    type: required
    reason: Live patroller map requires an authenticated session

ui_hints:
  layout: centered_form
  field_order:
    - call_sign
    - password
  submit_label: Login
  brand:
    title: PATROL LOG
    logo: cpf-wierdabrug-logo
  auto_resume:
    description: On app launch, if device_token is present and valid, skip the form and auto-resume
