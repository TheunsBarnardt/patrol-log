name = "patrol-log-api"
main = "src/index.ts"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

# Non-secret environment variables.
# Secrets (DATABASE_URL, JWT_SECRET, CORS_ORIGINS) are set with `wrangler secret put`
# and do NOT belong in this file.
[vars]
APP_NAME = "Patrol Log API"
ENV = "production"

# ── Custom domain (optional) ─────────────────────────────────
# Uncomment once you've added a zone to Cloudflare and want the API
# reachable at api.your-domain.example instead of *.workers.dev.
#
# routes = [
#   { pattern = "api.patrol-log.example.com/*", zone_name = "patrol-log.example.com" }
# ]
